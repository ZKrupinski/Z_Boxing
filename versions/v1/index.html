function pressAttack(f,type,heavy=false){if(scene!=='fight'||f.ko)return false;const data={type,heavy,life:9};if(f.stun>0||f.attack){f.buffer=data;return false;}startAttack(f,type,heavy);return true;}

function landHit(attacker,victim,att){const s=specs[att.type],d=getDistance(attacker,victim),dir=attacker.face,heavy=att.heavy;let inRange=d>=s.min&&d<=s.max; if(Math.abs(attacker.y-victim.y)>80)inRange=false;
    // Valid attack: close jabs become vulnerable, but still graze on contact.
    if(!inRange){attacker.balance=clamp(attacker.balance-s.miss*(heavy?1.3:1),0,100); if(att.type!=='jab'){pushPopup(attacker.x,attacker.y-270,'WHIFF','#a8bfd5');}playSound('jab',.28);return;}

    let counter=(att.type==='hook'&&opponentAtt==='jab'&&d<120)||(att.type==='upper'&&opponentAtt==='hook'&&d<110)||(att.type==='jab'&&opponentAtt==='upper'&&d>125);
    let damage=s.damage*(heavy?1.65:1)*(counter?1.55:1)*(victim.balance<28?1.28:1)*(attacker.side==='red'?.73:1);
    if(att.type==='jab'&&d<100)damage*=.55;

    if(victim.guarding){if(att.type==='jab'){damage=0;blocked=true;victim.guard=clamp(victim.guard-s.guard,0,100);}else if(att.type==='hook'){victim.guard=clamp(victim.guard-s.guard*(heavy?1.4:1),0,100);if(victim.guard<=0){guardBreak=true;damage*=.64;victim.stun=Math.max(victim.stun,22);victim.guarding=false;}else{damage*=.08;blocked=true;}}else{damage*=.84;victim.guard=clamp(victim.guard-9,0,100);}}
    if(blocked){sparks(victim.x-dir*48,victim.y-220,dir,'#9bdafa',7);playSound('block');pushPopup(victim.x,victim.y-285,att.type==='jab'?'BLOCK':'GUARD','#a8e6ff');victim.balance=clamp(victim.balance-1.5,0,100);return;}
    victim.hp=clamp(victim.hp-damage,0,100);victim.balance=clamp(victim.balance-damage*(counter?2.15:1.3),0,100);victim.stun=Math.max(victim.stun,Math.floor((heavy?13:8)+(counter?9:0)+(guardBreak?9:0)));
    victim.flash=5;victim.x=clamp(victim.x+dir*(s.knock*(heavy?1.3:1)),170,1110);victim.vx+=dir*2.2;attacker.hitCount++;attacker.comboTimer=95;
    const x=(attacker.x+victim.x)/2-dir*9,y=victim.y-(att.type==='upper'?211:224);
    const col=counter?'#fdf3b3':att.type==='upper'?'#d4a6ff':att.type==='hook'?'#ffb679':'#aef1ff';
    sparks(x,y,dir,col,heavy?16:11,heavy||counter);
    if(guardBreak)pushPopup(victim.x,victim.y-310,'GUARD BREAK!','#ffb56c',true);
    else if(counter)pushPopup(victim.x,victim.y-307,'COUNTER!','#fff09a',true);
    else if(heavy)pushPopup(victim.x,victim.y-300,'POWER HIT!','#ffeeae',true);
    if(damage>=14)pushPopup(victim.x+42,victim.y-260,'-'+Math.round(damage),'#ffb7a8');
    playSound(att.type,(heavy?1.1:.8)+(counter?.25:0));freeze=Math.min(8,(heavy?5:att.type==='jab'?2:4)+(counter?1:0));shake=Math.max(shake,heavy?14:att.type==='jab'?5:9);camKick=dir*(heavy?13:8);impactGlow=heavy?13:8;

}
function updateAttack(f,other){if(f.stun>0)f.stun--;if(f.flash>0)f.flash--;if(f.heavyFlash>0)f.heavyFlash--;if(f.comboTimer>0)f.comboTimer--;else f.hitCount=0;
  if(f.buffer){f.buffer.life--;if(f.buffer.life<=0)f.buffer=null;}
  if(!f.attack&&f.stun===0&&f.buffer){const next=f.buffer;startAttack(f,next.type,next.heavy);}
  if(f.attack){let a=f.attack;a.t++;if(a.t>=a.contact&&!a.done){a.done=true;landHit(f,other,a);}if(a.t>=a.duration){f.attack=null;if(f.buffer&&f.buffer.life>0&&f.stun===0){let b=f.buffer;startAttack(f,b.type,b.heavy);}}}
  f.guarding=f.holdingGuard&&!f.attack&&!f.ko&&f.stun===0;
  if(f.guarding) f.guard=Math.min(100,f.guard+.06);
  else f.guard=Math.min(100,f.guard+.10);
  const moving=Math.abs(f.vx)+Math.abs(f.vy)>1.5;f.balance=Math.min(100,f.balance+(moving?.32:.07)*(f.attack?.3:1));
}

function motion(f,x,y){if(f.ko)return;const len=Math.hypot(x,y)||1;let speed=f.guarding?2.0:f.attack?1.5:3.75;if(f.stun>0)speed=.65;const targetX=x/len*speed,targetY=y/len*speed*.70;f.vx+=(targetX-f.vx)*.32;f.vy+=(targetY-f.vy)*.32;f.x=clamp(f.x+f.vx,172,1108);f.y=clamp(f.y+f.vy,414,514);if(Math.abs(f.vx)+Math.abs(f.vy)>.9)f.walk+=1;}
function updateAI(){if(enemy.ko||player.ko)return;const dist=getDistance(enemy,player),dx=player.x-enemy.x;enemy.face=sign(dx)||enemy.face;enemy.aiCD--;
  if(enemy.aiMove<=0){enemy.aiMove=rand(25,85);const roll=Math.random();enemy.aiBehavior=roll<.22?'retreat':roll<.58?'close':'box';}
  enemy.aiMove--;
  let mx=0,my=0;
  if(dist>155)mx=sign(dx);
  else if(dist<77)mx=-sign(dx)*.85;
  else if(enemy.aiBehavior==='retreat'&&dist<196)mx=-sign(dx)*.65;
  else if(enemy.aiBehavior==='close'&&dist>110)mx=sign(dx)*.65;
  if(Math.abs(enemy.y-player.y)>14)my=sign(player.y-enemy.y)*.7;
  else if(enemy.aiMove%30<8)my=Math.sin(clock/18)*.25;
  const threat=player.attack&&player.attack.t<player.attack.contact+3&&dist<specs[player.attack.type].max+15;
  if(threat&&Math.random()<.075){enemy.holdingGuard=true;enemy.aiCD=Math.max(enemy.aiCD,5);}else if(enemy.aiMove%25===0)enemy.holdingGuard=false;
  if(enemy.aiCD<=0&&!enemy.attack&&enemy.stun===0&&scene==='fight'){

    else if(dist<182){let t=Math.random()<.64?'hook':'jab';pressAttack(enemy,t,Math.random()<.13);}

function tick(){clock++;if(scene==='title'||scene==='end'||scene==='pause')return;

  for(let i=flashes.length-1;i>=0;i--){flashes[i].life--;if(flashes[i].life<=0)flashes.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--){let p=popups[i];p.y-=p.big?.65:.45;p.life--;if(p.life<=0)popups.splice(i,1);}

  ctx.beginPath();ctx.arc(joy.x+joyVector.x*44,joy.y+joyVector.y*44,28,0,Math.PI*2);ctx.fillStyle='rgba(106,186,226,.55)';ctx.fill();ctx.strokeStyle='#b7edff';ctx.lineWidth=3;ctx.stroke();
  text('MOVE',147,698,15,'#b9daed');
  buttons.forEach(b=>{const hold=[...holds.values()].find(h=>h.type===b.id),active=!!hold||(b.id==='guard'&&player.guarding);
    ctx.globalAlpha=active?1:.88;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=active?'rgba(255,255,255,.26)':'rgba(12,23,45,.78)';ctx.fill();ctx.strokeStyle=b.color;ctx.lineWidth=active?6:3;ctx.stroke();
    if(hold&&b.id!=='guard'){let progress=clamp((clock-hold.start)/25,0,1);ctx.beginPath();ctx.arc(b.x,b.y,b.r+6,-Math.PI/2,-Math.PI/2+progress*Math.PI*2);ctx.strokeStyle='#fff6cc';ctx.lineWidth=5;ctx.stroke();}
    text(b.label,b.x,b.y-6,b.id==='upper'?19:21,b.color);text(b.sub,b.x,b.y+19,13,'#e7edff');
  });ctx.globalAlpha=1;text('짧게: 기본 펀치   |   길게: 연속 강타',798,698,14,'#c0cce0');ctx.restore();}
function drawIconButton(){roundRect(1211,169,43,37,8,'rgba(12,19,34,.85)','#4b627c');text(muted?'♪×':'♪',1232,186,22,muted?'#ed999f':'#d4eeff');}
function drawOverlay(){if(scene==='title'){ctx.fillStyle='rgba(6,9,20,.67)';ctx.fillRect(0,0,W,H);let glow=ctx.createRadialGradient(640,300,20,640,300,470);glow.addColorStop(0,'rgba(71,113,154,.26)');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  text('ARCADE BOXING',640,154,29,'#f8cc78');text('RING THEORY',640,243,96,'#ffffff');text('거리와 타이밍으로 승부하는 1 ROUND',640,308,22,'#b9d4ee');
  roundRect(373,354,534,153,15,'rgba(8,19,39,.92)','#5c7291');
  text('거리별 펀치 상성',640,381,23,'#ffde8b');text('잽 · 원거리 견제   /   훅 · 가드 파괴   /   어퍼 · 가드 관통',640,414,19,'#e7efff');text('큰 공격이 빗나가면 밸런스가 무너집니다.',640,447,19,'#c4cee2');text('풋워크로 밸런스를 회복하세요.',640,477,18,'#9cc9e5');
  roundRect(463,530,354,69,12,'#ffe080','#fff0bb');text('GAME START',640,563,37,'#1b273b');text('ENTER 또는 화면 터치',640,640,18,'#d7e7f7');
  text('PC  WASD/방향키 이동  |  J 잽  K 훅  L 어퍼  SPACE 가드',640,683,17,'#b0c7dd');
 }
 if(scene==='pause'){ctx.fillStyle='rgba(4,8,20,.72)';ctx.fillRect(0,0,W,H);text('PAUSED',640,286,76,'#f4efff');text('P 또는 화면 터치로 재개',640,368,24,'#cadcec');}
 if(scene==='end'){ctx.fillStyle='rgba(3,9,22,.77)';ctx.fillRect(0,0,W,H);text(finalText,640,252,100,winner==='blue'?'#ffe487':winner==='red'?'#ff8791':'#fff');
  text(winner==='blue'?'DISTANCE IS EVERYTHING':winner==='red'?'READ THE RANGE. TRY AGAIN.':'EVEN MATCH',640,328,27,'#d8e6f8');
  roundRect(445,376,390,113,14,'rgba(13,25,44,.9)','#6981a8');text(`YOU  ${Math.round(player.hp)}  :  ${Math.round(enemy.hp)}  CPU`,640,408,33,'#fff');text(`남은 시간 ${Math.max(0,Math.ceil(roundTime/60))}초`,640,461,19,'#a6bed8');
  roundRect(457,535,367,67,12,'#ffe080','#fff0bb');text('REMATCH',640,568,34,'#172339');text('ENTER 또는 화면 터치',640,643,19,'#cad8e9');}
}
function drawImpactFrame(){if(scene!=='ko')return;if(koFx<4){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);}else if(koFx<12){ctx.fillStyle=koFx%3===0?'rgba(255,255,255,.55)':'rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);}else if(koFx<20){ctx.fillStyle='rgba(2,6,13,.67)';ctx.fillRect(0,0,W,H);} }
function render(){ctx.save();const jitter=shake>0?(Math.random()-.5)*shake:0,jitterY=shake>0?(Math.random()-.5)*shake*.5:0;ctx.translate(jitter+camKick,jitterY);drawArena();drawImpactFrame();
  // Depth sorting: active attacker in front for overlapping silhouettes.
  let sorted=[player,enemy].sort((a,b)=>(a.y+(a.attack?12:0))-(b.y+(b.attack?12:0)));
  sorted.forEach(drawFighter);drawFront();drawEffects();ctx.restore();drawHUD();drawIconButton();drawButtons();drawOverlay();}
function animate(ts){if(!frameTime)frameTime=ts;let dt=clamp(ts-frameTime,0,75);frameTime=ts;acc+=dt;let count=0;while(acc>=1000/FPS&&count<4){tick();acc-=1000/FPS;count++;}render();requestAnimationFrame(animate);}
function pointerPos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function mapButton(x,y){let found=null,near=Infinity;buttons.forEach(b=>{let d=Math.hypot(x-b.x,y-b.y);if(d<b.r+18&&d<near){near=d;found=b;}});return found;}
function setJoy(x,y){let dx=x-joy.x,dy=y-joy.y,m=Math.hypot(dx,dy);if(m>joy.r){dx=dx/m*joy.r;dy=dy/m*joy.r;}joyVector={x:dx/joy.r,y:dy/joy.r};}
function beginHold(id,type){holds.set(id,{type,start:clock,strong:false});if(type==='guard'){player.holdingGuard=true;}else{player.holdingGuard=false;pressAttack(player,type,false);}}
function releaseHold(id){let h=holds.get(id);if(!h)return;holds.delete(id);if(h.type==='guard'){player.holdingGuard=[...holds.values()].some(x=>x.type==='guard')||keyDown.has(' ');}}
C.addEventListener('pointerdown',e=>{e.preventDefault();C.setPointerCapture?.(e.pointerId);initAudio();const {x,y}=pointerPos(e);if(scene==='title'||scene==='end'){reset();return;}if(scene==='pause'){scene='fight';return;}
 if(x>1200&&y>150&&y<215){muted=!muted;return;}
 if(scene!=='fight')return;
 const b=mapButton(x,y);if(b){pointers.set(e.pointerId,{kind:'button',id:`touch-${e.pointerId}`});beginHold(`touch-${e.pointerId}`,b.id);}else if(x<350&&y>480){pointers.set(e.pointerId,{kind:'joy'});setJoy(x,y);}
});
C.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(p?.kind==='joy'){e.preventDefault();const {x,y}=pointerPos(e);setJoy(x,y);}});
function pointerUp(e){const p=pointers.get(e.pointerId);if(p?.kind==='joy')joyVector={x:0,y:0};if(p?.kind==='button')releaseHold(p.id);pointers.delete(e.pointerId);}
C.addEventListener('pointerup',pointerUp);C.addEventListener('pointercancel',pointerUp);C.addEventListener('lostpointercapture',pointerUp);
const keyMoves=new Set(['a','s','d','w','arrowup','arrowleft','arrowright','arrowdown',' ','j','k','l','enter','p','r','m']);
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(keyMoves.has(key))e.preventDefault();if(e.repeat)return;initAudio();if(key==='enter'&&(scene==='title'||scene==='end')){reset();return;}if(key==='r'&&scene!=='title'){reset();return;}if(key==='m'){muted=!muted;return;}if(key==='p'&&(scene==='fight'||scene==='pause')){scene=scene==='fight'?'pause':'fight';return;}keyDown.add(key);if(scene!=='fight')return;const type={j:'jab',k:'hook',l:'upper',' ':'guard'}[key];if(type)beginHold(`key-${key}`,type);});
window.addEventListener('keyup',e=>{const key=e.key.toLowerCase();keyDown.delete(key);releaseHold(`key-${key}`);});
window.addEventListener('blur',()=>{keyDown.clear();holds.clear();pointers.clear();joyVector={x:0,y:0};if(player)player.holdingGuard=false;if(scene==='fight')scene='pause';});
window.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='fight')scene='pause';});
player=makeFighter('blue');enemy=makeFighter('red');requestAnimationFrame(animate);
})();
</script>
