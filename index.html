<script>
(()=>{
'use strict';
const C=document.getElementById('game'),HUD=document.getElementById('hud'),shell=document.getElementById('shell'),focusHint=document.getElementById('focusHint');

const W=1280,H=720,FPS=60,FW=300,FH=300;
// Shift stage elements visually; physics, HUD and touch controls remain in world coordinates.
const RING_VERTICAL_SHIFT=70;
const MAX_HP=200,ROUND_SECONDS=180;
// Footwork: faster closing, deliberate quick backsteps, and independent hit recoil.

const KNOCK_FRICTION=.82,DOWN_KNOCK_FRICTION=.72;

sprites.red.src='assets/sprites/red_fighter.png';

// Independent hand-drawn reaction frames. No sprite rotations used for falls.
const REACTION_WIDTH=480,REACTION_HEIGHT=400; // Repacked rise + dizzy: 480x400 per frame, feet aligned

// Wider, individually drawn knockdown frames use a larger padded 4x3 atlas.
const FALL_WIDTH=512,FALL_HEIGHT=420;
const reactionImages={blue:{},red:{}};
reactionImages.blue.dizzy=new Image();reactionImages.blue.dizzy.src='assets/sprites/blue_dizzy.png?rev=20261117blue8';
reactionImages.blue.fall=new Image();reactionImages.blue.fall.src='assets/sprites/blue_fall_extended.webp';
reactionImages.blue.rise=new Image();reactionImages.blue.rise.src='assets/sprites/blue_rise.png?rev=20261117rise11';
reactionImages.red.fall=new Image();reactionImages.red.fall.src='assets/sprites/red_fall_extended.webp';
reactionImages.red.rise=new Image();reactionImages.red.rise.src='assets/sprites/red_rise.png?rev=20261117rise11';
const reactionLengths={dizzy:8,fall:12,rise:11};

const gameImages=[sprites.blue,sprites.red,...Object.values(reactionImages.blue),...Object.values(reactionImages.red)];
let assetsReady=false,assetsFailed=false;
function preloadGameAssets(){

 const ready=gameImages.map(img=>img.decode?img.decode():new Promise((resolve,reject)=>{
  if(img.complete){img.naturalWidth?resolve():reject(new Error('sprite load failed'));return;}

 }));
 Promise.all(ready).then(()=>{assetsReady=true;}).catch(err=>{
  console.error('Boxing asset preload failed',err);assetsFailed=true;
 });
}
preloadGameAssets();

const poses={idle:0,walk:1,guard:2,jab:3,hook:4,upper:5,hurt:6,ko:7,win:8};
// Frame data is the single source of truth for animation, hitbox timing and recovery.
const specs={

 hook:{startup:7,active:4,recovery:13,min:35,max:186,optimal:[83,165],damage:12,knock:17,cost:7,miss:18,guard:43,label:'HOOK'},
 upper:{startup:10,active:4,recovery:16,min:16,max:139,optimal:[33,112],damage:16,knock:24,cost:9,miss:24,guard:10,label:'UPPERCUT'}
};

// Real character dimensions, kept independent from visible art. Coordinates are in world pixels.
function hurtboxes(f){if(f.down||f.ko)return [];return [
 {x:f.x-39,y:f.y-269,w:78,h:63,part:'HEAD'},
 {x:f.x-53,y:f.y-207,w:106,h:103,part:'BODY'},
 {x:f.x-42,y:f.y-103,w:84,h:94,part:'LEGS'} ];}

 const near=type==='jab'?36:type==='hook'?28:9;

 const h=type==='jab'?65:type==='hook'?79:116;
 const boost=a.heavy?13:0,lo=near*face,hi=(reach+boost)*face;
 return {x:f.x+Math.min(lo,hi),y:f.y+top,w:Math.abs(hi-lo),h};}
let showBoxes=false;

const joy={x:147,y:606,r:66},buttons=[{id:'jab',x:963,y:624,r:49,color:'#f7da62',label:'JAB',sub:'잽'},{id:'hook',x:1064,y:561,r:50,color:'#fb8f6a',label:'HOOK',sub:'훅'},{id:'upper',x:1171,y:618,r:51,color:'#c89bff',label:'UPPER',sub:'어퍼'},{id:'guard',x:1073,y:663,r:45,color:'#71c9ff',label:'GUARD',sub:'가드'}];
const keyDown=new Set(),pointers=new Map(),holds=new Map();let joyVector={x:0,y:0};
let scene='title',player,enemy,clock=0,roundTime=ROUND_SECONDS*FPS,shake=0,camKick=0,freeze=0,koFx=0,gameOverDelay=0,particles=[],popups=[],flashes=[],impactGlow=0,downSlowMs=0,finalText='',winner='';
let muted=false,audio=null,noiseBuffer=null,frameTime=0,acc=0,renderFraction=0;
let stars=Array.from({length:70},(_,i)=>({x:(i*113+47)%W,y:85+(i*41)%185,r:1+(i%3)}));
let crowd=Array.from({length:72},(_,i)=>({x:i*20-5,y:306+(i*13)%31,h:18+(i*17)%30,col:i%7===0?'#62708e':i%3===0?'#303a57':'#293349'}));
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sign=v=>v<0?-1:v>0?1:0;
function makeFighter(side){return {side,x:side==='blue'?224:1056,y:side==='blue'?465:465,vx:0,vy:0,knockVX:0,face:side==='blue'?1:-1,hp:MAX_HP,balance:100,guard:100,attack:null,buffer:null,guarding:false,holdingGuard:false,parryFrames:0,parryRecoil:0,stun:0,flash:0,walk:0,aiCD:50,aiMove:0,aiBehavior:'approach',ko:false,down:false,downTimer:0,dizzy:0,tempDowns:0,recoverLock:0,hitCount:0,comboTimer:0,heavyFlash:0};}

function initAudio(){try{if(!audio) {audio=new (window.AudioContext||window.webkitAudioContext)();const len=Math.floor(audio.sampleRate*.13);noiseBuffer=audio.createBuffer(1,len,audio.sampleRate);let a=noiseBuffer.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;}if(audio.state==='suspended')audio.resume();}catch(e){audio=null;}}
function playSound(type,power=1){if(muted||!audio)return;try{const t=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);let freq=125,dur=.095,volume=.13,shape='sine';if(type==='jab'){freq=155;dur=.068;volume=.09;shape='triangle'}if(type==='hook'){freq=95;dur=.11;volume=.16}if(type==='upper'){freq=73;dur=.17;volume=.19}if(type==='block'){freq=360;dur=.05;volume=.06;shape='square'}if(type==='parry'){freq=720;dur=.19;volume=.19;shape='triangle'}if(type==='bell'){freq=670;dur=.5;volume=.065;shape='sine'}if(type==='ko'){freq=51;dur=.6;volume=.23}osc.type=shape;osc.frequency.setValueAtTime(freq*(.95+Math.random()*.1),t);osc.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.45),t+dur);gain.gain.setValueAtTime(Math.min(.32,volume*power),t);gain.gain.exponentialRampToValueAtTime(.001,t+dur);osc.start(t);osc.stop(t+dur+.01);if(noiseBuffer&&type!=='bell'){const n=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();n.buffer=noiseBuffer;f.type='lowpass';f.frequency.value=type==='parry'?2400:type==='block'?1500:450;n.connect(f);f.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(type==='block'?.05:.16*power,t);g.gain.exponentialRampToValueAtTime(.001,t+Math.min(.11,dur));n.start(t);n.stop(t+Math.min(.12,dur));}}catch(e){} }
// Floating combat labels are intentionally disabled: effects and hit reactions are visual only.
function pushPopup(x,y,message,color='#fff',big=false){}
function sparks(x,y,dx,color,amount=10,big=false){amount=Math.min(18,amount);for(let i=0;i<amount;i++){let ang=Math.random()*Math.PI*2,mag=rand(big?4:2,big?11:7);particles.push({x,y,vx:Math.cos(ang)*mag+dx*2,vy:Math.sin(ang)*mag-1.1,life:rand(12,24),max:25,col:Math.random()<.3?'#ffffff':color,size:rand(2,6),line:big});}if(particles.length>150)particles.splice(0,particles.length-150);flashes.push({x,y,life:big?15:11,max:big?15:11,r:big?55:34,col:color});}
function canGuard(f){return f.holdingGuard&&!f.attack&&!f.ko&&!f.down&&f.stun===0&&f.dizzy===0&&f.recoverLock===0;}
function setGuardHold(f,held){
 if(held&&!f.holdingGuard){f.parryFrames=canGuard({...f,holdingGuard:true})?PARRY_WINDOW_FRAMES:0;}
 if(!held)f.parryFrames=0;
 f.holdingGuard=held;
 f.guarding=canGuard(f);
}
function pressAttack(f,type,heavy=false){if(scene!=='fight'||f.ko||f.down||f.dizzy>0)return false;const data={type,heavy,life:9};if(f.stun>0||f.attack){f.buffer=data;return false;}startAttack(f,type,heavy);return true;}
function startAttack(f,type,heavy=false){if(f.ko||f.down||f.dizzy>0)return;f.parryFrames=0;let s=specs[type];f.attack={type,heavy,t:0,startup:s.startup+(heavy?5:0)+(f.side==='red'?2:0),active:s.active+(heavy?1:0),recovery:s.recovery+(heavy?8:0),done:false,hitTargets:new Set(),connected:false,missDone:false,canCancel:false};f.attack.duration=f.attack.startup+f.attack.active+f.attack.recovery;f.guarding=false;f.buffer=null;f.balance=clamp(f.balance-(heavy?s.cost*1.35:s.cost)*.38,0,100);if(heavy)f.heavyFlash=22;}
function getDistance(a,b){return Math.hypot(a.x-b.x,(a.y-b.y)*1.55);}
function landHit(attacker,victim,att){
 const s=specs[att.type],d=getDistance(attacker,victim),dir=attacker.face,heavy=att.heavy;
 if(att.hitTargets.has(victim.side)||victim.down||victim.ko||Math.abs(attacker.y-victim.y)>80)return false;
 if(! (d>=s.min&&d<=s.max))return false;
 const fist=hitbox(attacker,att);
 if(!hurtboxes(victim).some(box=>overlaps(fist,box)))return false;
 att.hitTargets.add(victim.side);att.connected=true;att.canCancel=true;
 const opponentAtt=victim.attack?.type||'';
 let counter=(att.type==='hook'&&opponentAtt==='jab'&&d<120)||(att.type==='upper'&&opponentAtt==='hook'&&d<110)||(att.type==='jab'&&opponentAtt==='upper'&&d>125);
 let damage=s.damage*(heavy?1.65:1)*(counter?1.55:1)*(victim.balance<28?1.28:1)*(attacker.side==='red'?.73:1);
 if(att.type==='jab'&&d<100)damage*=.55;
 if(att.type==='hook'&&d<65)damage*=.78;
 // Held guard fully blocks all punch classes, including heavy hooks and uppercuts.
 // Resolve the current button state so a fresh press works on the very next hit frame.
 if(canGuard(victim)){
  att.hitTargets.add(victim.side);att.connected=true;att.canCancel=false;
  if(victim.parryFrames>0){
   victim.parryFrames=0; // one counter per fresh guard press
   attacker.attack=null;attacker.buffer=null;attacker.stun=Math.max(attacker.stun,PARRY_STUN_FRAMES);
   attacker.guarding=false;attacker.holdingGuard=false;attacker.parryFrames=0;
   attacker.vx=0;attacker.vy=0;
   attacker.x=clamp(attacker.x-dir*27,172,1108);
   attacker.knockVX=clamp(-dir*PARRY_RECOIL_SPEED,-32,32);
   attacker.parryRecoil=23;
   victim.guard=clamp(victim.guard+8,0,100);
   const fx=victim.x-dir*58,fy=victim.y-201;
   sparks(fx,fy,-dir,'#ccf6ff',18,true);
   flashes.push({x:fx,y:fy,life:18,max:18,r:84,col:'#fff7bf'});
   playSound('parry',1.2);shake=Math.max(shake,12);camKick=-dir*17;
   impactGlow=Math.max(impactGlow,14);freeze=Math.max(freeze,4);
   if(navigator.vibrate&&victim.side==='blue')try{navigator.vibrate([18,18,45])}catch(e){}
  }else{
   // No chip damage or guard-break even at low guard meter.
   victim.guard=clamp(victim.guard-s.guard*.25,0,100);
   sparks(victim.x-dir*50,victim.y-195,dir,'#9bdafa',6);
   playSound('block');victim.balance=clamp(victim.balance-.7,0,100);
  }
  return true;
 }
 victim.hp=clamp(victim.hp-damage,0,MAX_HP);
 victim.balance=clamp(victim.balance-damage*(counter?2.15:1.3),0,100);
 victim.stun=Math.max(victim.stun,Math.floor((heavy?13:8)+(counter?9:0)));
 // Separate recoil from input velocity: a hit cannot be immediately erased by locomotion smoothing.
 const kbPos=Math.min(20,s.knock*(att.type==='jab'?.6:att.type==='hook'?.85:1)*(heavy?1.22:1)*(counter?1.18:1));
 const kbVel=(att.type==='jab'?8.5:att.type==='hook'?12.0:15.5)*(heavy?1.3:1)*(counter?1.18:1);
 victim.flash=5;
 victim.x=clamp(victim.x+dir*kbPos,172,1108);
 victim.vx*=.18;victim.vy*=.65;
 victim.knockVX=clamp(victim.knockVX*.35+dir*kbVel,-27,27);
 attacker.hitCount++;attacker.comboTimer=95;
 const x=victim.x-dir*34,y=victim.y-(att.type==='upper'?222:192);
 const col=counter?'#fdf3b3':att.type==='upper'?'#d4a6ff':att.type==='hook'?'#ffb679':'#aef1ff';
 sparks(x,y,dir,col,heavy?16:11,heavy||counter);
 if(counter)pushPopup(victim.x,victim.y-307,'COUNTER!','#fff09a',true);
 else if(heavy)pushPopup(victim.x,victim.y-300,'POWER HIT!','#ffeeae',true);
 if(damage>=14)pushPopup(victim.x+42,victim.y-260,'-'+Math.round(damage),'#ffb7a8');
 playSound(att.type,(heavy?1.1:.8)+(counter?.25:0));freeze=Math.min(8,(heavy?5:att.type==='jab'?2:4)+(counter?1:0));shake=Math.max(shake,heavy?14:att.type==='jab'?5:9);camKick=dir*(heavy?13:8);impactGlow=heavy?13:8;
 if(navigator.vibrate&&attacker.side==='blue')try{navigator.vibrate(heavy?35:15)}catch(e){}
 if(victim.hp<=0){victim.flash=0;victim.heavyFlash=0;victim.guarding=false;victim.holdingGuard=false;victim.stun=0;victim.dizzy=0;victim.ko=true;victim.down=true;downSlowMs=900;victim.downTimer=9999;victim.attack=null;victim.buffer=null;scene='ko';koFx=0;freeze=8;shake=25;camKick=dir*25;gameOverDelay=0;winner=attacker.side;finalText=winner==='blue'?'YOU WIN':'YOU LOSE';playSound('ko');return true;}
 const breakPoint=victim.balance<=0;
 if(breakPoint&&!victim.down){
   victim.attack=null;victim.buffer=null;victim.guarding=false;victim.holdingGuard=false;
   const causesDown = heavy || counter || att.type==='upper' || att.type==='hook' || victim.tempDowns>0;
   if(causesDown){
     victim.down=true;victim.downTimer=130;victim.dizzy=0;downSlowMs=Math.max(downSlowMs,900);victim.tempDowns++;victim.stun=Math.max(victim.stun,28);victim.knockVX=clamp(victim.knockVX+dir*2.5,-27,27);
     pushPopup(victim.x,victim.y-315,'DOWN!','#ffdf93',true);freeze=Math.max(freeze,8);shake=Math.max(shake,18);camKick=dir*18;
   }else{
     victim.dizzy=92;victim.stun=Math.max(victim.stun,16);victim.knockVX=clamp(victim.knockVX+dir*1.2,-27,27);pushPopup(victim.x,victim.y-300,'DIZZY!','#ffe991',true);
   }
 }

}
function updateAttack(f,other){
 if(f.stun>0)f.stun--;if(f.flash>0)f.flash--;if(f.heavyFlash>0)f.heavyFlash--;
 if(f.comboTimer>0)f.comboTimer--;else f.hitCount=0;

   f.downTimer--;
   f.vx*=.86;f.vy*=.84;
   if(f.downTimer<=0&&!f.ko){
     f.down=false;f.recoverLock=18;f.stun=Math.max(f.stun,12);f.balance=38;f.guard=34;f.dizzy=20;
   }
 }
 if(f.dizzy>0){f.dizzy--; if(clock%16===0)pushPopup(f.x+rand(-12,12),f.y-292,'...','#fff2a8');}

 if(!f.attack&&f.stun===0&&!f.down&&f.dizzy===0&&f.buffer){const next=f.buffer;startAttack(f,next.type,next.heavy);}
 if(f.attack){let a=f.attack;a.t++;

  if(!a.missDone&&a.t>=a.startup+a.active){a.missDone=true;
   if(!a.connected){const s=specs[a.type];f.balance=clamp(f.balance-s.miss*(a.heavy?1.3:1),0,100);
    if(a.type!=='jab')pushPopup(f.x,f.y-294,'WHIFF','#b0c8dc');playSound('jab',.24);}}
  if(f.buffer&&f.stun===0&&a.connected&&a.t>=a.startup+a.active+2&&f.buffer.type!==a.type&&!f.down&&!f.dizzy){let b=f.buffer;startAttack(f,b.type,b.heavy);}
  else if(a.t>=a.duration){f.attack=null;if(f.buffer&&f.buffer.life>0&&f.stun===0&&!f.down&&f.dizzy===0){let b=f.buffer;startAttack(f,b.type,b.heavy);}}
 }
 f.guarding=canGuard(f);
 f.guard=Math.min(100,f.guard+(f.guarding?.06:.11));
 const moving=Math.abs(f.vx)+Math.abs(f.vy)>1.5;

}
function keyboardVec(){return {x:((keyDown.has('d')||keyDown.has('arrowright'))?1:0)-((keyDown.has('a')||keyDown.has('arrowleft'))?1:0),y:((keyDown.has('s')||keyDown.has('arrowdown'))?1:0)-((keyDown.has('w')||keyDown.has('arrowup'))?1:0)};}
function motion(f,x,y){
 if(f.ko||f.down)return;

function render(){
 // HUD is painted on an independent transparent canvas, never inside camera or knockback transforms.
 // Even knockdown slomo, camera shake and scene shifts cannot translate its own canvas context.
 if(!assetsReady){
  ctx=worldCtx;drawLoadingScreen();
  hudCtx.setTransform(1,0,0,1,0,0);hudCtx.clearRect(0,0,W,H);
  return;
 }
 ctx=worldCtx;
 ctx.save();
 ctx.setTransform(1,0,0,1,0,0);
 drawArena();drawImpactFrame(); // Keep the environment stable during a knockdown.
 const jitter=shake>0?(Math.random()-.5)*shake:0;
 const jitterY=shake>0?(Math.random()-.5)*shake*.5:0;
 ctx.save();ctx.translate(jitter+camKick,jitterY+RING_VERTICAL_SHIFT);
 let sorted=[player,enemy].sort((a,b)=>(a.y+(a.attack?12:0))-(b.y+(b.attack?12:0)));
 sorted.forEach(drawFighter);drawDebugBoxes();drawEffects();
 ctx.restore();
 // Foreground ring ropes stay glued to the static arena instead of camera recoil.
 ctx.save();ctx.translate(0,RING_VERTICAL_SHIFT);drawFront();ctx.restore();
 ctx.restore();

 // Overlay is completely decoupled from the shifted world canvas.
 ctx=hudCtx;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
 ctx.clearRect(0,0,W,H);
 drawHUD();drawDebugLabel();drawIconButton();drawButtons();drawOverlay();
 ctx=worldCtx;
}
function animate(ts){
 if(!frameTime)frameTime=ts;
 const dt=clamp(ts-frameTime,0,75);frameTime=ts;
 // Use real-time milliseconds for the brief knockdown cinematic so frame data remains 60 Hz.
 // Do not dilate the initial hitstop; slow the subsequent fall and the KO descent instead.
 const slow=downSlowMs>0&&(scene==='ko'||(scene==='fight'&&freeze===0));
 acc+=dt*(slow?.48:1);
 if(slow)downSlowMs=Math.max(0,downSlowMs-dt);
 let count=0;while(acc>=1000/FPS&&count<4){tick();acc-=1000/FPS;count++;}
 renderFraction=clamp(acc/(1000/FPS),0,1);render();requestAnimationFrame(animate);
}
function pointerPos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function mapButton(x,y){let found=null,near=Infinity;buttons.forEach(b=>{let d=Math.hypot(x-b.x,y-b.y);if(d<b.r+18&&d<near){near=d;found=b;}});return found;}
function setJoy(x,y){let dx=x-joy.x,dy=y-joy.y,m=Math.hypot(dx,dy);if(m>joy.r){dx=dx/m*joy.r;dy=dy/m*joy.r;}joyVector={x:dx/joy.r,y:dy/joy.r};}
function beginHold(id,type){holds.set(id,{type,start:clock,strong:false});if(type==='guard'){setGuardHold(player,true);}else{setGuardHold(player,false);pressAttack(player,type,false);}}
function releaseHold(id){let h=holds.get(id);if(!h)return;holds.delete(id);if(h.type==='guard'){setGuardHold(player,[...holds.values()].some(x=>x.type==='guard')||keyDown.has(' '));}}
C.addEventListener('pointerdown',e=>{e.preventDefault();focusGame();if(!assetsReady){if(assetsFailed)window.location.reload();return;}C.setPointerCapture?.(e.pointerId);initAudio();const {x,y}=pointerPos(e);if(scene==='title'||scene==='end'){reset();return;}if(scene==='pause'){scene='fight';return;}
 if(x>1200&&y>150&&y<215){muted=!muted;return;}
 if(scene!=='fight')return;
 const b=mapButton(x,y);if(b){pointers.set(e.pointerId,{kind:'button',id:`touch-${e.pointerId}`});beginHold(`touch-${e.pointerId}`,b.id);}else if(x<350&&y>480){pointers.set(e.pointerId,{kind:'joy'});setJoy(x,y);}
});
C.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(p?.kind==='joy'){e.preventDefault();const {x,y}=pointerPos(e);setJoy(x,y);}});
function pointerUp(e){const p=pointers.get(e.pointerId);if(p?.kind==='joy')joyVector={x:0,y:0};if(p?.kind==='button')releaseHold(p.id);pointers.delete(e.pointerId);}
C.addEventListener('pointerup',pointerUp);C.addEventListener('pointercancel',pointerUp);C.addEventListener('lostpointercapture',pointerUp);
// Use physical KeyboardEvent.code first: controls also work with Korean IME active.
const codeToKey={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyJ:'j',KeyK:'k',KeyL:'l',KeyP:'p',KeyR:'r',KeyM:'m',KeyB:'b',Digit1:'1',Digit2:'2',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',Space:' ',Enter:'enter',NumpadEnter:'enter'};
const controlKeys=new Set(['a','s','d','w','arrowup','arrowleft','arrowright','arrowdown',' ','j','k','l','enter','p','r','m','b','1','2']);
function controlKey(e){return codeToKey[e.code]??String(e.key||'').toLowerCase();}
function keyPressed(e){const key=controlKey(e);if(!controlKeys.has(key)||e.ctrlKey||e.altKey||e.metaKey)return;
 e.preventDefault();e.stopPropagation();if(e.repeat)return;if(!assetsReady){if(assetsFailed&&key==='enter')window.location.reload();return;}initAudio();
 if(key==='enter'&&(scene==='title'||scene==='end')){reset();return;}
 if(key==='r'&&scene!=='title'){reset();return;}
 if(key==='m'){muted=!muted;return;}if(key==='b'){showBoxes=!showBoxes;return;}if((key==='1'||key==='2')&&scene==='fight'){window.__boxingTest.forceReaction('red',key==='1'?'dizzy':'down');return;}
 if(key==='p'&&(scene==='fight'||scene==='pause')){scene=scene==='fight'?'pause':'fight';return;}
 keyDown.add(key);if(scene!=='fight')return;const type={j:'jab',k:'hook',l:'upper',' ':'guard'}[key];if(type)beginHold(`key-${key}`,type);
}
function keyReleased(e){const key=controlKey(e);if(!controlKeys.has(key))return;e.preventDefault();e.stopPropagation();keyDown.delete(key);releaseHold(`key-${key}`);}
document.addEventListener('keydown',keyPressed,true);document.addEventListener('keyup',keyReleased,true);
shell.addEventListener('focus',updateFocusHint);shell.addEventListener('blur',updateFocusHint);
window.addEventListener('focus',()=>requestAnimationFrame(updateFocusHint));
window.addEventListener('blur',()=>{keyDown.clear();holds.clear();pointers.clear();joyVector={x:0,y:0};if(player)setGuardHold(player,false);if(scene==='fight')scene='pause';requestAnimationFrame(updateFocusHint);});

window.__boxingTest={reset:()=>reset(),state:()=>({assetsReady,assetsFailed,scene,player:{x:player.x,y:player.y,hp:player.hp,balance:player.balance,attack:player.attack&&{type:player.attack.type,t:player.attack.t,startup:player.attack.startup,active:player.attack.active,connected:player.attack.connected}},enemy:{x:enemy.x,y:enemy.y,hp:enemy.hp,balance:enemy.balance,down:enemy.down,downTimer:enemy.downTimer,dizzy:enemy.dizzy},showBoxes}),forceReaction:(who,type)=>{const f=who==='red'?enemy:player;f.attack=null;f.buffer=null;f.stun=0;f.ko=false;f.dizzy=0;f.down=false; if(type==='dizzy'){f.dizzy=92;f.balance=0;}else if(type==='down'){f.down=true;f.downTimer=130;f.balance=0;}else if(type==='ko'){f.ko=true;f.down=true;f.downTimer=9999;scene='ko';koFx=0;winner=f.side==='red'?'blue':'red';finalText=winner==='blue'?'YOU WIN':'YOU LOSE';}},setReactionTimer:(who,t)=>{const f=who==='red'?enemy:player;if(f.down)f.downTimer=Math.max(1,Math.floor(t));},setPositions:(x1,x2)=>{player.x=x1;enemy.x=x2;player.y=enemy.y=465;},toggleBoxes:()=>showBoxes=!showBoxes};player=makeFighter('blue');enemy=makeFighter('red');updateFocusHint();requestAnimationFrame(animate);
})();
